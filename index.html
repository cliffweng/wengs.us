<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weng Family Giving</title>
<meta name="description" content="The Weng family supports charitable causes through a donor-advised fund.">
<style>
  :root {
    --bg: #f7f5f0;
    --ink: #24292e;
    --muted: #5d6670;
    --accent: #2f5d50;
    --line: #dcd8cf;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 38rem;
    margin: 0 auto;
    padding: 4rem 1.25rem 2rem;
  }
  h1 {
    margin: 0 0 1rem;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 2.75rem);
    line-height: 1.2;
    color: var(--accent);
  }
  p { margin: 0 0 1rem; font-size: 1.1rem; }
  .contact { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--line); }
  h2 { margin: 0 0 1rem; font-size: 1.15rem; font-weight: 600; }
  label { display: block; margin-bottom: 1rem; font-size: 0.95rem; color: var(--muted); }
  input, textarea {
    display: block;
    width: 100%;
    margin-top: 0.3rem;
    padding: 0.6rem 0.75rem;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  textarea { min-height: 8rem; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    padding: 0.65rem 1.5rem;
    font: inherit;
    font-size: 1rem;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { margin-top: 1rem; font-size: 0.95rem; min-height: 1.4em; }
  #status.ok { color: #1d6b3a; }
  #status.err { color: #a12622; }
  footer {
    padding: 1.5rem 1.25rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>Weng Family Giving</h1>
  <p>The Weng family supports charitable causes through a donor-advised fund.</p>
  <p>Giving is guided by the causes the family cares about.</p>

  <section class="contact" aria-labelledby="contact-title">
    <h2 id="contact-title">Contact</h2>
    <!-- TODO: add mailto fallback once a contact email is confirmed -->
    <form id="contact-form">
      <label>Name
        <input type="text" name="name" autocomplete="name" required>
      </label>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit">Send</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </section>
</main>
<footer>&copy; Weng Family</footer>

<script>
  // TODO(formspree): replace with real form ID
  const FORMSPREE_ENDPOINT = 'https://formspree.io/f/TODO_FORM_ID';

  const form = document.getElementById('contact-form');
  const statusEl = document.getElementById('status');
  const button = form.querySelector('button');

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    button.disabled = true;
    setStatus('Sending…');
    try {
      const response = await fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        body: new FormData(form),
        headers: { Accept: 'application/json' }
      });
      if (response.ok) {
        form.reset();
        setStatus('Thank you. Your message has been sent.', 'ok');
      } else {
        setStatus('Sorry, your message could not be sent. Please try again later.', 'err');
      }
    } catch (err) {
      setStatus('Sorry, your message could not be sent. Please check your connection and try again.', 'err');
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
